<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart-AI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030712;
            --primary: #00f2fe;
            --secondary: #4facfe;
            --success: #00ff88;
            --danger: #ff0844;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            max-width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Ambient Glows */
        .ambient-glow-1 { position: absolute; top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(79, 172, 254, 0.1) 0%, transparent 60%); filter: blur(80px); z-index: -1; pointer-events: none; }
        .ambient-glow-2 { position: absolute; bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 60%); filter: blur(80px); z-index: -1; pointer-events: none; }

        /* Modern Navbar */
        .navbar {
            display: flex; justify-content: center; align-items: center; padding: 18px 8%;
            background: rgba(3, 7, 18, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); z-index: 100; gap: 40px;
        }
        .navbar a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 700; letter-spacing: 1.5px; transition: color 0.3s; text-transform: uppercase; }
        .navbar a:hover { color: white; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* Main Wrapper */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
            z-index: 10;
        }

        /* Glass Quote Card */
        .quote-card {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 16px; 
            padding: 25px 40px; max-width: 800px; text-align: center; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.4); 
            border-left: 4px solid var(--primary); /* Glowing left border */
            margin-bottom: 40px;
        }
        .quote-text { font-family: 'Space Grotesk', sans-serif; font-style: italic; color: white; font-size: 1.3rem; line-height: 1.5; font-weight: 400; margin-bottom: 10px; display: block; }
        .quote-author { color: var(--primary); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }

        /* Action Cards Container */
        .card-container { display: flex; gap: 30px; max-width: 1000px; justify-content: center; flex-wrap: wrap; width: 100%; }
        
        .action-card { 
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px; 
            padding: 40px 25px; width: 340px; text-align: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;
        }

        .action-card:hover { transform: translateY(-12px); border-color: rgba(255, 255, 255, 0.2); }
        .action-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 60%); opacity: 0; transition: 0.4s; }
        .action-card:hover::before { opacity: 1; }

        .icon-wrapper { width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; margin-bottom: 20px; transition: transform 0.3s; }
        .action-card:hover .icon-wrapper { transform: scale(1.1); }

        /* Blue Theme (Vitals) */
        .card-vitals:hover { box-shadow: 0 20px 40px rgba(0, 242, 254, 0.1); }
        .card-vitals .icon-wrapper { background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.2); box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.2); }
        .card-vitals .btn { background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%); color: #000; }

        /* Green Theme (ECG) */
        .card-ecg:hover { box-shadow: 0 20px 40px rgba(0, 255, 136, 0.1); }
        .card-ecg .icon-wrapper { background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.2); box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.2); }
        .card-ecg .btn { background: linear-gradient(135deg, #27ae60 0%, var(--success) 100%); color: #000; }

        .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; color: white; margin-bottom: 12px; font-weight: 700; display: block; }
        .card-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 30px; display: block; flex-grow: 1; }
        
        .btn { padding: 12px 25px; border-radius: 50px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; width: 90%; display: inline-block; transition: 0.3s; font-size: 0.85rem; border: none; }
        .action-card:hover .btn { transform: scale(1.05); }

    </style>
</head>
<body>
    
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="navbar">
        <a href="/">HOME</a>
        <a href="/history">HISTORY DATABASE</a>
    </div>

    <div class="main-wrapper">
        
        <div class="quote-card">
            <span class="quote-text" id="quote">"Loading inspiration..."</span>
            <span class="quote-author" id="author"></span>
        </div>

        <div class="card-container">
            
            <div class="action-card card-vitals" onclick="window.location.href='/predict_vitals_page'">
                <div class="icon-wrapper">📊</div>
                <span class="card-title">Clinical Vitals</span>
                <span class="card-desc">Enter 13 clinical parameters manually for an XGBoost-driven heart risk assessment.</span>
                <span class="btn">Start Vitals Analysis</span>
            </div>

            <div class="action-card card-ecg" onclick="window.location.href='/predict_image_page'">
                <div class="icon-wrapper">📸</div>
                <span class="card-title">ECG Image AI</span>
                <span class="card-desc">Upload ECG scan images for deep learning visual diagnosis using CNN architecture.</span>
                <span class="btn">Upload ECG Scan</span>
            </div>

        </div>

    </div>

    <script>
        const quotes = [
            {t: "A healthy heart is a fountain of joy.", a: "Medical Proverb"},
            {t: "Your heart is the engine of your life. Keep it tuned.", a: "Clinical Wisdom"},
            {t: "Health is a state of complete harmony of the body, mind and spirit.", a: "B.K.S. Iyengar"}
        ];
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote').innerText = `"${q.t}"`;
        document.getElementById('author').innerText = `— ${q.a}`;
    </script>
</body>
</html>
